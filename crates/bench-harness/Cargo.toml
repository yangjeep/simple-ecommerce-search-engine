[package]
name = "bench-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Reusable statistical rigor infrastructure (repeated measurement, distributions, bootstrap CIs, run manifests, CSV/JSON artifacts) for Issue #6's multi-round research campaign. Not itself an experiment -- every phase2-eval/round1-eval performance binary depends on this instead of hand-rolling percentile math."

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

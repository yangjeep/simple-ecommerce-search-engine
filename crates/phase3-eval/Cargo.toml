[package]
name = "phase3-eval"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Phase 3 (Issue #14, safe fast-path offload frontier over Solr) experiments. Solr is the safety-net fallback, not a baseline to beat outright: a cheap admission check decides whether a query is safe+complete enough for native FastPath execution, otherwise it forwards unmodified to Solr."

[dependencies]
bench-harness = { path = "../bench-harness" }
commerce-core = { path = "../commerce-core" }
# round1-eval's `solr` module owns Solr query construction/HTTP (the same
# fresh, same-run, same-environment local instance Phase 2's P1-D used,
# dataset_cache/solr/solr-9.10.1) -- Phase 3 forwards rejected queries to
# it directly, unmodified, as the safety-net fallback path.
round1-eval = { path = "../round1-eval" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Issue #6 P1-D's own adversarial review (P2-E17) found Phase 2's
# "smallest-N-by-native-query-id" sampling was a real, non-random
# limitation. Phase 3 draws its per-class/per-experiment query samples via
# a seeded ChaCha8Rng instead, from the start, rather than repeating that
# critique.
rand = "0.8"
rand_chacha = "0.3"

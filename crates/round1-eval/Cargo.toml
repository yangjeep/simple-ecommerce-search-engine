[package]
name = "round1-eval"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Round 1 realistic-evidence experiments (real catalog/query ingestion, external baseline harness) against commerce-core. Not part of the Phase 0 evidence base; depends on it read-only."

[dependencies]
commerce-core = { path = "../commerce-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Issue #14 (Phase 3): shared Solr query-construction/HTTP helpers
# (`solr` module), factored out of Phase 2's eval binary so later phases
# reuse the same, already-adversarially-reviewed construction.
ureq = { version = "2", features = ["json"] }

[package]
name = "issue42-eval"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Issue #42: preregistered R1 (typed ambiguity/corroborated resolution), R2 (residual lexical semantics), R3 (identifier serving primitive) experiments, plus their shared independent ground-truth oracle and regression-check layer. Governed by \"do not trust the experiment author\": the oracle never imports issue38_e2e3_eval's own generate_workload/judgment-map helpers, re-deriving relevance directly from commerce_core::domain fields on the actually-materialized catalog instead."

[dependencies]
commerce-core = { path = "../commerce-core" }
issue38-e2e3-eval = { path = "../issue38-e2e3-eval" }
phase9-eval = { path = "../phase9-eval" }
bench-harness = { path = "../bench-harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
tantivy = "0.22"

[package]
name = "phase6a-eval"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Phase 6A (Issue #23) experiments: reproduce Phase 5's structural browse/PLP breakpoints on WANDS, an independent real-category-hierarchy dataset substituted for the unreachable Amazon Reviews 2023 (see PHASE6A_DECISION.md)."

[dependencies]
bench-harness = { path = "../bench-harness" }
commerce-core = { path = "../commerce-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rand = "0.8"
rand_chacha = "0.3"

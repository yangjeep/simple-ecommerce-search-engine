[package]
name = "phase5-eval"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Phase 5 (Issue #17, browse/PLP as a commerce-native fast-path workload) experiments. Real Brand/Color-based filter/facet/sort/pagination benchmark against a fair, docValues-tuned Solr baseline -- category/hierarchy/price/inventory are out of scope, since this catalog has no real data for them (see docs/experiments/PHASE5_LOG.md)."

[dependencies]
bench-harness = { path = "../bench-harness" }
commerce-core = { path = "../commerce-core" }
round1-eval = { path = "../round1-eval" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rand = "0.8"
rand_chacha = "0.3"

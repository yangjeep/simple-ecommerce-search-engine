claim: >
  Isolates Hypothesis 2 (semantic/lexicon-compilation gap) behind P9-E02's
  REVISE: is the 68.75% Punt-routed WANDS traffic share because those
  queries genuinely have no related structural entity, or because
  compile_lexicon's exact-lowercased-phrase matching misses a real entity
  due to a literal vocabulary mismatch? Pure measurement, no production
  code changed. Result: H2a (pipe-split product_class) and H2b (category
  leaf segment) FALSIFIED as material contributors (0.0% and 1.0% of
  zero-constraint queries recoverable, both well under the 10% bar).
  H2c (plural/singular normalization) CONFIRMED material: 25.8%
  (81/314) of zero-constraint queries would gain a real structural
  constraint under simple trailing-"s" normalization. 72.0% (226/314) are
  not recoverable under any tested mechanism -- genuinely no related
  entity, or a gap this diagnostic's specific mechanisms do not cover.


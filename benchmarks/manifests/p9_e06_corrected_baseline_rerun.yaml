    ir::query::compile
  baseline: fresh, same-run Apache Solr 9.10.1 (wands_bench core),
    identical to P9-E02/P9-E04

workload:
  planner_policy: selectivity_threshold=0.05, delegate_oversample=20 (unchanged)
  k: 10
  warmup: identical to the original P9-E02/P9-E04 binaries' own warmup passes
  repetitions: 3 independent full runs for P9-E02 (matching its own
    original manifest), 6 independent full runs for P9-E04 (matching its
    own original manifest) -- NDCG/recall figures deterministic and
    identical across all runs within each binary; latency figures vary
    run to run as expected

seed: "n/a (deterministic real-data selection, no sampling)"

raw_results: docs/research/artifacts/p9_e06_corrected_baseline_rerun/

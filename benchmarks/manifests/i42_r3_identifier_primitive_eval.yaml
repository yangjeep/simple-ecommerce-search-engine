# Worked-example manifest (see benchmarks/README.md for the convention).
experiment_id: I42-R3
phase: issue-42
issue: 42
decision_document: docs/experiments/ISSUE42_LOG.md#i42-r3
claim: >
  Issue #42 R3: does a dedicated identifier dictionary primitive
  (selected only for fields whose measured statistics -- uniqueness
  ratio, entropy, never a field's name -- look identifier-like) achieve
  higher Recall@1 and lower false-match rate than indexing variant text
  in a general-purpose lexical delegate, with a lower incremental
  update cost, while correctly abstaining on non-identifier fields?

  Three treatments, each its own self-contained index-and-lookup path
  (issue42-eval::r3_experimental) -- not routed through
  commerce_core::plan::execute_planned/LexicalDelegate at all, per a
  dated correction below:

  A (real, unmodified BitmapTantivyDelegate/build_index, product-level
  Text/title only): finds 0 of 2972 held-out identifiers -- part_number
  is variant-level only and never indexed at all. Confirms H3-A.

  B (VariantTextIndex, an experimental per-variant Tantivy index with
  real product_ordinal/variant_ordinal fields stored per document):
  achieves 100% Recall@1 / 0% false-match on the genuinely-unique
  held-out sample and correctly surfaces both variants of a deliberate
  collision, but matches a bare prefix query it should reject --
  confirming H3-B's own predicted weakness directly (a general-purpose
  text index has no notion of "this token is a complete identifier").

  C (IdentifierClassifier + IdentifierDictionary: a calibrated
  uniqueness-ratio cutoff, chosen only from the calibration set's own
  measured statistics, gating a dedicated normalized-key dictionary):
  matches B's Recall@1/false-match numbers exactly on the one field
  (part_number) it accepts, correctly REJECTS the prefix and
  adversarial near-miss queries B incorrectly matches/would match, and
  builds/updates substantially faster than B in every one of 5
  independent runs. Every other field present in the held-out catalog
  (17 of 18) correctly ABSTAINS -- including a deliberately-added
  "legitimate cross-reference" field with only 2 occurrences sharing
  one value, statistically indistinguishable from a low-cardinality
  field at that sample size, falling back to Treatment B exactly as
  the protocol's own abstention behavior requires. Confirms H3-C.
  **PASSES every preregistered R3 GO-gate criterion.**

  **Two preregistration corrections, found before any treatment code
  was written, both dated in ISSUE42_PROTOCOL.md**: (1)
  automotive::generate_catalog takes no seed parameter at all -- the
  protocol's literal "generate_catalog(1500) with SEED.wrapping_add(1000)"
  is unachievable, and naively calling it twice at different n would
  make the smaller calibration call a byte-identical PREFIX of the
  larger held-out call (same reseeded RNG, same index-driven
  generation), silently violating calibration/held-out disjointness --
  fixed by generating one automotive::generate_catalog(4500) call and
  splitting it by index range into disjoint [0,1500)/[1500,4500)
  slices; (2) commerce_core::plan::LexicalHit has no VariantId field at
  all, and verify_and_truncate's per-variant resolution is vacuously
  true whenever query.constraints is empty -- exactly the case for an
  identifier-only query, since compile() has no dedicated "part number"
  keyword branch -- so today's real production pipeline always returns
  a product's FIRST variant for such a query regardless of which
  variant's text a delegate matched. This is why every R3 treatment is
  its own self-contained index-and-lookup path returning a real,
  variant-aware IdentifierHit, never a commerce_core::plan::LexicalHit.

  **A self-caught methodology bug, found and fixed before any
  adversarial review**: the initial Recall@1/false-match sample counted
  every naturally-occurring identifier collision (automotive's own real
  rng.gen_range(1000..9999) draw occasionally repeating by chance --
  the same phenomenon the calibration set's own 0.998 uniqueness ratio
  already showed) as a false match whenever the sample happened to
  iterate to one collision-partner and the top hit resolved to the
  other -- conflating a genuine, correctly-surfaced collision
  (separately tested and passing via the dedicated collision_pair case)
  with an actual wrong resolution. This produced an initial false
  positive read of "Treatment C FAILS the GO gate" (0.37% false-match)
  purely from this test-methodology artifact, not a real defect in the
  dictionary. Fixed by excluding catalog-wide-non-unique identifiers
  (22 of 2994 candidates, disclosed, not silently dropped) from the
  Recall@1/false-match sample -- after which both B and C measure
  exactly 100%/0%. A second, unrelated determinism bug was also
  self-caught the same way (diffing 5 runs' summary JSON before
  trusting a "byte-identical" claim): shannon_entropy_bits summed
  floating-point terms in HashMap's randomized-per-process iteration
  order, producing a last-ULP difference in one calibration field's
  mean_entropy_bits between runs -- fixed by switching to BTreeMap's
  deterministic order.

  **Second correction round (adversarial review, before any production
  change was made)**: a fresh reviewer with no implementation task
  independently recomputed every number and claim above from the raw
  artifacts and source and found four substantive issues plus one minor
  one, all independently reproduced before being fixed: (1)
  `IdentifierClassifier::accepts` silently narrowed the protocol's own
  preregistered multi-signal classifier design down to uniqueness ratio
  alone, undisclosed; (2) a concrete consequence -- `lumens` (a genuine
  non-identifier field) scored uniqueness_ratio=0.94 on calibration,
  only 0.01 below cutoff (a sample-size artifact: 0.89 on the
  2x-larger held-out set). A first candidate fix (a format-consistency
  gate) was tested with real numbers and found to EMPIRICALLY FAIL --
  it would have incorrectly rejected the true `part_number` field
  itself (~0.51-0.56, lower than several non-identifiers), because
  automotive's own brand/type names vary in word count. This negative
  result is recorded, not erased -- the statistic remains computed and
  reported but does not gate. The real fix: also require
  `variant_scoped` (already computed, previously unused; a structural,
  not numeric, discriminator), verified to change zero existing
  classification decisions. (3) Build/incremental-update cost had only
  been measured at one variants-per-product level; fixed with a new
  scaling-curve section measuring 4 dedicated levels independently --
  Treatment C's build time scales linearly with total variant count as
  expected; Treatment B's incremental-update cost shows the same
  bimodal split already disclosed at the main catalog scale recurring
  at every level, ruling out variants-per-product as the trigger. (4)
  The general-lexical-regression check was argued (a built-then-
  discarded catalog), not measured; fixed with a real
  `CatalogIndex::execute_ranked` check against 3 real free-text
  queries, run twice, asserting byte-identical hit counts. (5, minor)
  the console print and JSON summary read `index_b.index_size_bytes()`
  at two different points in the run under one label; fixed by
  capturing one consistent snapshot (129,315 bytes, superseding --
  not silently replacing -- the originally-published 129,713). None of
  these fixes reverses the GO verdict.

  **Terminal verdict: GO for Treatment C.** Mirroring R2's own outcome
  (unlike R1's REVISE), Treatment C's calibrated-classifier-plus-
  dictionary mechanism clears every preregistered GO-gate criterion,
  including after the second-correction-round fixes above, confirmed
  across 5 freshly regenerated runs byte-identical on every correctness/
  classification field. Per Issue #42's own rule, this is a real
  candidate for a RED-before-GREEN production change -- deliberately
  NOT made in this same pass; the production-change step itself is
  tracked separately (task #63, reviewing R1/R2/R3's serving-contract
  decisions together). Full detail: `docs/experiments/ISSUE42_LOG.md`'s
  "I42-R3" section.


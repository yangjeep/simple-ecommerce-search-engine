build_command: cargo build --release -p issue42-eval
run_command: |
  ./target/release/r3_identifier_primitive_eval [output_summary_json_path]

dataset:
  name: automotive::generate_catalog(4500), split by index range into a
    1500-product calibration slice [0,1500) and a 3000-product held-out
    slice [1500,4500) (see ISSUE42_PROTOCOL.md's dated correction for
    why -- the frozen generator has no seed parameter, so two separate
    calls would make calibration a byte-identical prefix of held-out).
    Calibration is additionally augmented with two deliberately
    non-identifier-like fields (a low-cardinality Enum re-labeled
    "sku_code", and a free-text "product_fingerprint" field with real
    per-string entropy but zero per-variant uniqueness). The held-out
    slice is additionally augmented with: a guaranteed collision
    (product 0's part_number overwritten to match product 1's real
    value), an absent identifier (product 2's part_number removed
    entirely), a legitimate cross-reference (products 3/4 share one
    cross_reference_code value, a field distinct from part_number), an
    adversarial near-miss (a single-character edit of product 5's real
    part_number), and a hand-built 7-variant stress product (fresh id
    range, each variant with its own distinct part_number).
    mixed_merchant's 3,000-product mixed catalog (matching E3's own
    established 1000/1000/1000 split) is retained separately for a
    future general-lexical-regression comparison, not used for any
    core identifier-classification metric.
  source: crates/issue42-eval/src/r3_workload.rs::build_calibration_and_held_out,
    build_held_out_mixed
  size: 1500 calibration products + 3001 held-out products (3000 real +
    1 hand-built 7-variant stress product), 1 variant each except the
    stress product

engine:
  treatment_a: phase9_eval::bitmap_delegate::BitmapTantivyDelegate /
    build_index (unmodified, reused verbatim)
  treatment_b: issue42_eval::r3_experimental::VariantTextIndex (new,
    additive, per-variant Tantivy index -- experimental only)
  treatment_c: issue42_eval::r3_experimental::{IdentifierClassifier,
    IdentifierDictionary} (new, additive -- experimental only)
  note: none of these route through commerce_core::plan::execute_planned/
    LexicalDelegate -- see the dated correction above for why.

workload:
  calibration_fields_measured: 19 (part_number accepted; sku_code and
    product_fingerprint, the two deliberately misleading fields,
    correctly rejected)
  held_out_fields_measured: 18 (part_number accepted; all 17 others,
    including cross_reference_code, correctly abstained)
  recall_sample: 2972 genuinely-unique held-out identifiers (22 of 2994
    candidates excluded as members of a natural collision group,
    disclosed above)
  corner_cases: collision (both variants surfaced), absent identifier
    (never a false-match target), legitimate cross-reference
    (classifier abstains, falls back to B, both products found),
    adversarial near-miss (rejected by C), bare prefix (rejected by C,
    matches under B -- confirms H3-B), many-variant stress (all 7
    variants individually resolvable via C)
  min_uniqueness_ratio: 0.95 (issue42_eval::r3_experimental::MIN_UNIQUENESS_RATIO,
    chosen from the calibration set's own measured statistics alone,
    never re-tuned against held-out numbers)

seed: "fully hand-specified extension pieces layered on
  automotive::generate_catalog(4500)'s own deterministic RNG output --
  reproducible by construction, no wall-clock, no re-seeding per run"

latency_methodology: >
  P50/P95/P99 via bench_harness::Distribution over the median of 7
  independent 200-call std::hint::black_box-guarded batched trials per
  query (same discipline as Issue #38's E1 and Issue #42's R1/R2), over
  a 200-query sample. 5 independent full runs confirm every
  correctness/classification/recall/false-match/violation number is
  byte-identical; only latency/build-time/incremental-update-time/RSS
  numbers vary run-to-run and are reported as ranges, not a single
  favorable run. Treatment B's incremental-update cost showed a real,
  disclosed BIMODAL split across the 5 runs (2 of 5 ~4.4-7.4ms, 3 of 5
  ~104.5-107.4ms) rather than a smooth range -- plausibly Tantivy's own
  segment-merge policy occasionally triggering synchronously on a
  single-document commit, not independently confirmed against Tantivy's
  internals (a disclosed open question, not asserted as settled).
  Treatment C's incremental update (a single HashMap insert) was
  consistently and substantially lower than B's in every run regardless
  of B's own variance, satisfying the GO gate's own build/update-cost
  criterion unambiguously.

raw_results: docs/research/artifacts/i42_r3_run1/
  - main_run{1,2,3,4,5}.txt (5 independent full runs)
  - summary.json / summary_run{2,3,4,5}.json (machine-readable per-run summaries)

analysis: printed directly by the binary per run; see
  docs/experiments/ISSUE42_LOG.md's "I42-R3" section for the full
  hypothesis-by-hypothesis breakdown and the GO verdict for Treatment C.

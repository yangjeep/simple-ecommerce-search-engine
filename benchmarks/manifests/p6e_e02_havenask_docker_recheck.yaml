# Worked-example manifest (see benchmarks/README.md for the convention).
experiment_id: P6E-E02
phase: 6E
issue: 21
decision_document: PHASE6E_DECISION.md
claim: >
  Not a benchmark -- a live re-verification of Havenask's own two
  independent Phase 6B/6C blockers, prompted by P6E-E00/E01 unblocking
  two of Havenask's sibling engines via a previously-untried route.
  Finding: the `docker`/`dockerd` binaries now exist in this container
  and the daemon starts successfully when launched directly (a real
  change from "Docker daemon absent"), but no container image can be
  pulled via any registry tested -- Docker Hub, ghcr.io, and an AWS
  public ECR mirror all have reachable registry/auth APIs but return
  403 Forbidden from their actual blob/CDN storage hosts, a general
  network-policy restriction on container-image data specifically, not
  registry-specific. Havenask's own registry
  (registry.cn-hangzhou.aliyuncs.com) remains additionally blocked at
  the connection level, unchanged from Phase 6B/6C. No Havenask mirror
  found on Docker Hub under plausible names. Net result: Havenask
  remains genuinely blocked -- the headline verdict is unchanged -- but
  the reason is now more precisely characterized than "Docker daemon
  absent." See docs/experiments/PHASE6E_LOG.md for the full account.


# Worked-example manifest (see benchmarks/README.md for the convention).
experiment_id: P6D-E02
phase: 6D
issue: 21
decision_document: PHASE6D_DECISION.md
claim: >
  An adversarial follow-up to P6D-E00/E01, not a coverage extension:
  does the ordinal facet-counting technique still help when the naive
  baseline never paid the expensive per-candidate attribute-map clone
  color's baseline paid? Implemented brand_facet_counts_ordinal /
  category_facet_counts_ordinal / product_type_facet_counts_ordinal
  on CatalogIndex, correctness-gated exactly against the existing
  _by_scan methods (new unit test) and against Solr's own live
  response (extended p6a_e00's product_class-under-category-leaf
  operation). Result: a REAL CROSSOVER, not a uniform win -- the
  ordinal method is 1.9x-5.2x SLOWER than the existing scan at small
  candidate counts (n=2, n=13), and only faster past a real threshold
  (2.3x at n=121, 6.2x at n=1,103), because it trades a fixed,
  dictionary-size-proportional per-call cost (~860 distinct
  product_class values in WANDS) for per-candidate savings that are
  smaller when there is no clone to remove. This is a genuine
  qualifier to P6D-E00/E01's own "ordinal always wins" framing: the
  technique's win depends on both candidate count and how expensive
  the baseline being replaced already was. See
  docs/experiments/PHASE6D_LOG.md for the full hypothesis and result.

git_sha: PENDING
binary: crates/commerce-core/src/index/mod.rs (brand/category/product_type_facet_counts_ordinal), crates/phase6a-eval/src/bin/p6a_e00_wands_vs_native_eval.rs (benchmark)
